<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        const ok = (v) => v === "light" || v === "dark" || v === "system";
        let mode = "system";
        try {
          const own = localStorage.getItem("mapdle:theme");
          if (ok(own)) mode = own;
          else {
            const store = JSON.parse(localStorage.getItem("geography-gym-profiles-v1") || "null");
            const profile = store && store.profiles && (store.profiles.find((p) => p.id === store.activeProfileId) || store.profiles[0]);
            const t = profile && profile.preferences && profile.preferences.theme;
            if (ok(t)) mode = t;
          }
        } catch (e) {}
        const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", mode === "system" ? (dark ? "dark" : "light") : mode);
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Mapdle: one hidden place every day. Place up to five pins on the globe, follow the color and direction hints, and share your result." />
